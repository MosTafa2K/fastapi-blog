services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=blog
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=realmostafa
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  test-db:
    image: postgres:17
    environment:
      - POSTGRES_DB=blog_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data_test:/var/lib/postgresql/data

volumes:
  pg_data:
  pg_data_test: